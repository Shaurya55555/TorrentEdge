<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TorrentEdge — Login (UI Preview)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --surface-2: #171b24;
    --border: #232833;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .notice {
    max-width: 380px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
  }
  .logo {
    font-weight: 700;
    font-size: 1.15rem;
    margin-bottom: 4px;
  }
  .sub {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #565f70; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 24px;
  }
  .row a { color: var(--accent); text-decoration: none; }
  button {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 11px;
    color: #fff;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .footer-link {
    text-align: center;
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .footer-link a { color: var(--accent); text-decoration: none; }
  .toast {
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
  <div class="notice">
    UI preview only — this form is not wired to a real backend, no credentials are sent or stored.
    See the <a href="https://github.com/Shaurya55555/TorrentEdge" style="color:inherit">source</a> for the
    real JWT/bcrypt auth implementation.
  </div>

  <div class="card">
    <div class="logo">TorrentEdge</div>
    <div class="sub">Sign in to manage your torrents</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="off" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="off" />
      </div>
      <div class="row">
        <span></span>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit">Sign In</button>
    </form>

    <div class="toast" id="toast">This is a static UI preview — sign-in isn't functional here.</div>

    <div class="footer-link">
      <a href="index.html">← Back to showcase</a>
    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var toast = document.getElementById('toast');
    toast.style.display = 'block';
  });
</script>
</body>
</html>
